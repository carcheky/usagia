name: Release

# Rama de release estable -> version sin sufijo (1.0.0, 1.0.1, 2.0.0...).
# Rama `beta` -> prerelease (1.1.0-beta.1...). Al fusionarla en `main`, semantic-release
# graduationa el prerelease y publica la version estable correspondiente.
on:
  push:
    branches:
      - main
      - beta
      - '+([0-9])?(.{+([0-9]),x}).x'
  workflow_dispatch:

# Menor privilegio por defecto. Cada job amplia solo lo que necesita.
permissions:
  contents: read

# Nunca se cancela una publicacion a medias: `cancel-in-progress: false` deja que
# un segundo push espere en cola en vez de matar un release a medio publicar.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commits:
    name: Commits convencionales
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Rango real del push. `github.event.before` no siempre sirve, y cuando no
      # sirve el pipeline se queda ROJO PARA SIEMPRE, porque `before` seguiria
      # apuntando al mismo commit huerfano en cada push posterior. Los casos
      # que lo rompen:
      #   1. Primer push a una rama nueva: `before` es todo-ceros.
      #   2. Tras un force-push, un squash o un rebase, ese sha deja de ser
      #      alcanzable y `actions/checkout` con fetch-depth 0 no lo trae ->
      #      `fatal: Invalid revision range d69c06b..HEAD`.
      #   3. MEDIDO el 2026-11-15 (este repo): tras un force-push, `before` apuntaba
      #      al commit viejo, que ya no era alcanzable. El `git cat-file -e` de mas
      #      abajo lo detecta, pero hace falta el `merge-base` explicito: commitlint
      #      busca el ancestro COMUN y falla con "Cannot find merge-base between
      #      'fecba85' and 'HEAD'" aunque el sha exista en el repositorio.
      - name: Resolver el rango de commits del push
        id: rango
        run: |
          ANTES="${{ github.event.before }}"
          VACIO="0000000000000000000000000000000000000000"
          SIN_MERGE_BASE=0

          if [ -z "$ANTES" ] || [ "$ANTES" = "$VACIO" ]; then
            ANTES="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            echo "El evento no trae \`before\` utilizable: se usa HEAD~1"
          elif ! git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            ANTES="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            echo "El \`before\` del evento no es un commit alcanzable de este checkout (force-push, squash o rebase): se usa HEAD~1"
          elif ! git merge-base "$ANTES" HEAD >/dev/null 2>&1; then
            # El sha existe pero NO es ancestro de HEAD: commitlint no hallaria
            # un ancestro comun y fallaria con "Cannot find merge-base".
            SIN_MERGE_BASE=1
            ANTES="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            echo "El \`before\` del evento no es ancestro de HEAD (history reescrito): se usa HEAD~1"
          fi

          echo "desde=$ANTES" >> "$GITHUB_OUTPUT"
          echo "sin_merge_base=$SIN_MERGE_BASE" >> "$GITHUB_OUTPUT"

      # Sin esto, un mensaje mal escrito NO da error: semantic-release lo ignora y
      # simplemente no publica nada. El fallo silencioso de "no hay release" es
      # justo el que hace poco fiable un pipeline de releases.
      #
      # Si el rango resuelto fuera de un solo commit, commitlint se queda sin
      # nada que comprobar; se avisa pero no se rompe el pipeline por eso.
      - name: Comprobar los mensajes con commitlint
        run: |
          if [ "$(git rev-list --count "${{ steps.rango.outputs.desde }}..HEAD" 2>/dev/null || echo 0)" -eq 0 ]; then
            echo "El push no trae commits nuevos que validar."
            exit 0
          fi
          npx --yes @commitlint/cli@latest --from "${{ steps.rango.outputs.desde }}" --to HEAD --verbose

  verify:
    name: Verificar la app
    needs: commits
    # En Windows, como en woptimizer: Electron necesita un servidor X en Linux
    # (xvfb) para arrancar, y el runner de Ubuntu no lo trae de serie. En
    # Windows no hay ese problema.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Comprobacion de humo: se consultan los cuatro proveedores y se sale con
      # codigo 0. Sin credenciales, los proveedores responden "unconfigured",
      # que NO es un fallo: lo que se comprueba aqui es que la resolucion de
      # credenciales y las consultas funcionan.
      #
      # Se usa `scripts/probe.js` (Node PURO) y no la app de Electron: en un
      # runner no hay display, y Electron sin servidor X revienta con
      # STATUS_BREAKPOINT. Los proveedores solo necesitan fetch y fs.
      - name: Comprobacion de humo
        run: node scripts/probe.js

      # Cuentas: varias instancias del mismo proveedor, cada una con su
      # credencial, y la cascada de resolucion. Es lo que sostiene la ventana
      # de configuracion.
      - name: Pruebas de cuentas
        run: node scripts/test-accounts.js

  release:
    name: semantic-release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Foto de los tags ya publicados ANTES de la corrida. El diff posterior es
      # lo que dice si esta corrida publico algo; `git describe` no sirve,
      # porque en un push sin commits publicables devolveria el tag viejo y
      # reconstruiria encima de una release anterior.
      - name: Congelar los tags ya publicados
        run: git tag --list 'v*' | sort > "$RUNNER_TEMP/tags_before.txt"

      # OJO con el segundo `-p` y con la MAYOR del preset, y no es cosmetico:
      # 1. `conventional-changelog-conventionalcommits` NO viene con semantic-release.
      #    `load-parser-config.js` (commit-analyzer) lo resuelve con
      #    `importFrom(cwd, 'conventional-changelog-conventionalcommits')`, y sin el
      #    paquete a mano el job muere con "Cannot find module". Ademas el preset por
      #    defecto de commit-analyzer es `angular`, NO `conventionalcommits`: sin el,
      #    los mensajes se parsean con otro criterio y la version sale mal.
      # 2. La mayor va FIJADA a la 9, y por evidencia de dependencias, no por
      #    costumbre: `@semantic-release/commit-analyzer@13.0.1` depende de
      #    `conventional-changelog-writer` (API clasica), mientras que el preset v10
      #    ya reescrito usa `@conventional-changelog/template`. La v9 es la ultima
      #    mayor con la API que espera el writer.
      - name: Calcular version y publicar la release
        run: npx --yes -p semantic-release@25 -p conventional-changelog-conventionalcommits@9 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver el tag recien publicado
        id: resolve
        run: |
          git fetch --tags --force --quiet
          git tag --list 'v*' | sort > "$RUNNER_TEMP/tags_after.txt"
          NUEVO="$(comm -13 "$RUNNER_TEMP/tags_before.txt" "$RUNNER_TEMP/tags_after.txt" | head -n1)"
          if [ -z "$NUEVO" ]; then
            echo "No hay commits publicables en este push: no se crea release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Release publicada: $NUEVO"
            echo "tag=$NUEVO" >> "$GITHUB_OUTPUT"
            echo "version=${NUEVO#v}" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Empaquetar para Windows
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Se compila EXACTAMENTE el commit etiquetado, no el HEAD de la rama: si
      # alguien empuja otra cosa mientras se compila, la release sigue siendo
      # reproducible respecto al tag que la nombra.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # La version va en el binario, no en el package.json: semantic-release
      # calcula la version y aqui se la pasamos a electron-builder.
      - name: Empaquetar instalador y portable
        run: >-
          npx electron-builder --win --publish never
          --config.extraMetadata.version=${{ needs.release.outputs.version }}
        env:
          # Sin certificado de firma no se busca ninguno: si no, electron-builder
          # busca uno en el almacen de Windows y falla en un runner limpio.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Adjuntar los artefactos a la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/*.exe
            dist/*.blockmap

  build-linux:
    name: Empaquetar para Linux
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Para compilar AppImage en un runner se necesita FUSE; el runner de
      # ubuntu-latest lo trae, pero en un contenedor sin privilegios se
      # desactiva y la construccion falla al montar.
      - name: Instalar dependencias
        run: |
          npm ci
          # libfuse2 hace falta en algunos runners para el AppImage (en otros
          # el paquete se llama libfuse2t64). Es opcional para COMPILAR, asi que
          # que no se instale no puede tumbar la build.
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libfuse2t64 || true

      - name: Empaquetar AppImage y deb
        run: >-
          npx electron-builder --linux --publish never
          --config.extraMetadata.version=${{ needs.release.outputs.version }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Adjuntar los artefactos a la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
